# Netlify: shared multi-user build.
# `web/` is the published frontend (generated by build_static.py);
# `netlify/functions/api.mjs` is the shared API, backed by Netlify Blobs.

[build]
  publish = "web"
  functions = "netlify/functions"
  command = "echo 'static build is committed; nothing to compile'"

[functions]
  node_bundler = "esbuild"
  # engine-core.js and schema.json live outside the functions folder
  included_files = ["shared/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
